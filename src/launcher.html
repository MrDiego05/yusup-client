<html>

<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline';">
    <link rel="stylesheet" href="assets/css/launcher.css">
    <title>Yusup Client</title>
    <script>
        window.onerror = function (message, source, lineno, colno, error) {
            const fs = require('fs');
            fs.appendFileSync('./renderer-error.log', `[RENDERER ERROR] ${message} at ${source}:${lineno}:${colno}\n${error ? error.stack : ''}\n\n`);
        };
        window.onunhandledrejection = function (event) {
            const fs = require('fs');
            const reason = event.reason;
            fs.appendFileSync('./renderer-error.log', `[UNHANDLED REJECTION] ${reason}\n${reason ? (reason.stack || reason) : ''}\n\n`);
        };
    </script>
</head>

<body>
    <div class="dragbar"></div>

    <div class="other">
        <div class="frame">
            <div id="minimize" class="button-frame">
                <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
                    <rect x="1.5" y="6" width="11" height="2" fill="currentColor"/>
                </svg>
            </div>
            <div id="close" class="button-frame">
                <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
                    <path d="M3 3L11 11M11 3L3 11" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
            </div>
        </div>
    </div>

    <div class="loading-overlay" id="loading-overlay">
        <div class="loading-content">
            <div class="loading-icon">
                <img src="assets/images/logo-large.png" alt="Yusup Logo">
            </div>
            <div class="loading-bar-track">
                <div class="loading-bar-fill" id="loading-bar-fill"></div>
            </div>
        </div>
    </div>
    <div class="popup">
        <div class="popup-tab">
            <div class="popup-title"></div>
            <div class="popup-content"></div>
            <div class="popup-options">
                <button class="popup-button">OK</button>
            </div>
        </div>
    </div>
    <div class="panels"></div>
    <script src="assets/js/launcher.js" type="module"></script>
</body>

</html>
