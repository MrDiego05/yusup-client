<html>

<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline';">
    <link rel="stylesheet" href="assets/css/launcher.css">
    <title>Yusup Client</title>
    <script>
        window.onerror = function (message, source, lineno, colno, error) {
            const fs = require('fs');
            fs.appendFileSync('./renderer-error.log', `[RENDERER ERROR] ${message} at ${source}:${lineno}:${colno}\n${error ? error.stack : ''}\n\n`);
        };
        window.onunhandledrejection = function (event) {
            const fs = require('fs');
            const reason = event.reason;
            fs.appendFileSync('./renderer-error.log', `[UNHANDLED REJECTION] ${reason}\n${reason ? (reason.stack || reason) : ''}\n\n`);
        };
    </script>
</head>

<body>
    <div class="dragbar"></div>

    <div class="other">
        <div class="frame">
            <div id="minimize" class="button-frame icon-minimize"></div>
            <div id="close" class="button-frame icon-close"></div>
        </div>
    </div>

    <div class="popup">
        <div class="popup-tab">
            <div class="popup-title"></div>
            <div class="popup-content"></div>
            <div class="popup-options">
                <button class="popup-button">OK</button>
            </div>
        </div>
    </div>
    <div class="panels"></div>
    <script src="assets/js/launcher.js" type="module"></script>
</body>

</html>
